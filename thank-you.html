<html lang="th">
<head>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap');
        :root {
          --gold-50:#FBF3D9; --gold-400:#E4BD5F; --gold-500:#D2A247; --gold-700:#B68438; --gold-800:#8A6520;
          --ink-900:#0A0A0A; --ink-700:#2A2724; --ink-500:#53504B;
          --line-100:#EFEAE1;
          --surface-card:#FFFFFF; --bg-base:#FAF8F3;
          --nav-link:#CCA16E; --on-gold:#3A2A08; --footer-text:#ECECEC;
          --grad-gold: linear-gradient(135deg, #F5D98B 0%, #E4BD5F 45%, #C49332 78%, #B68438 100%);
          --grad-gold-text: linear-gradient(180deg, #F3D98A 0%, #D2A247 55%, #A9782B 100%);
          --radius-md:12px; --radius-lg:16px;
          --shadow-card: 0 6px 18px rgba(120,90,30,.10);
          --shadow-gold: 0 8px 20px rgba(198,150,50,.35);
          --font-display: "Kanit","Prompt",system-ui,sans-serif;
          --font-body: "Prompt","IBM Plex Sans Thai","Sarabun",system-ui,sans-serif;
        }
        body { background-color: var(--bg-base); color: var(--ink-700); font-family: var(--font-body); }
        h1 { font-family: var(--font-display); }
        .gold-text { background: var(--grad-gold-text); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .btn { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; font-weight:600; border-radius:var(--radius-md); padding:0 1.5rem; min-height:48px; cursor:pointer; text-decoration:none; border:none; }
        .btn--gold { background-image: var(--grad-gold); color: var(--on-gold); box-shadow: var(--shadow-gold); }
        .card { background-color:var(--surface-card); border:1px solid var(--line-100); border-radius:var(--radius-lg); box-shadow:var(--shadow-card); padding:32px; text-align:center; }
        .nav { background-color: var(--ink-900); border-bottom: 1px solid var(--gold-800); }
        .footer { background-color: var(--ink-900); color: var(--footer-text); border-top:1px solid var(--gold-800); }
        .demo-note{ max-width:1280px; margin:0 auto 16px; padding:12px 16px; background:var(--gold-50); border:1px solid var(--gold-400); border-radius:12px; font-size:13px; color:#5C4715; }
        .checkmark { width:64px; height:64px; border-radius:999px; background-image:var(--grad-gold); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; font-size:28px; color:var(--on-gold); }
    </style>
</head>
<body class="antialiased">

    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5589B2GS"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <div class="max-w-container mx-auto px-4 pt-4">
        <div class="demo-note">หน้าทดสอบ: หน้านี้เหมาะสำหรับตั้ง "Conversion / Goal" ใน GA4 เพราะเป็นหน้าที่มาถึงหลังกรอกฟอร์มสำเร็จ (<code>page_view</code> ยิงอัตโนมัติ)</div>
    </div>

    <header class="nav">
        <div class="max-w-container mx-auto px-4 h-20 flex items-center justify-between gap-4">
            <a href="/" class="font-extrabold text-lg" style="color:var(--nav-link);">SAKSIT789</a>
        </div>
    </header>

    <section class="max-w-container mx-auto px-4 py-16">
        <div class="max-w-lg mx-auto card">
            <div class="checkmark">✓</div>
            <h1 class="text-2xl font-extrabold gold-text mb-2" id="thank-you-title">ดำเนินการสำเร็จ</h1>
            <p class="text-sm mb-6" style="color:var(--ink-500);" id="thank-you-desc">ขอบคุณที่ใช้บริการ Saksit789</p>
            <a href="/" class="btn btn--gold">กลับหน้าแรก</a>
        </div>
    </section>

    <footer class="footer py-8 text-center text-sm">Copyright © 2026 Saksit789 . All rights reserved.</footer>

    <script>
    (function () {
        var params = new URLSearchParams(window.location.search);
        var type = params.get('type');
        var titleEl = document.getElementById('thank-you-title');
        var descEl = document.getElementById('thank-you-desc');
        if (type === 'order') {
            titleEl.textContent = 'สั่งซื้อสำเร็จ';
            descEl.textContent = 'เจ้าหน้าที่จะติดต่อกลับเพื่อยืนยันการโอนย้ายเบอร์ภายใน 24 ชั่วโมง';
        } else if (type === 'contact') {
            titleEl.textContent = 'ส่งข้อความสำเร็จ';
            descEl.textContent = 'ทีมงานได้รับข้อความของคุณแล้ว และจะติดต่อกลับโดยเร็วที่สุด';
        }
    })();
    </script>
</body>
</html>
